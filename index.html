<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almacén Automatizado - Command Center & AMR Picking Simulator 2D</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            industrial: {
              950: '#090d16',
              900: '#0f172a',
              850: '#151e32',
              800: '#1e293b',
              700: '#334155',
              600: '#475569',
              cyan: '#06b6d4',
              accent: '#3b82f6',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    /* Diagonal Industrial Safety Stripes Pattern */
    .bg-safety-stripes {
      background: repeating-linear-gradient(
        45deg,
        rgba(16, 185, 129, 0.20),
        rgba(16, 185, 129, 0.20) 10px,
        rgba(15, 23, 42, 0.85) 10px,
        rgba(15, 23, 42, 0.85) 20px
      );
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 63 satellite positions (Sud 1 to Sud 63) mapped across Pasillos A - E
    const AISLE_CONFIG = {
      "Pasillo A": { suds: [1, 2, 3, 4, 5, 6, 7, 8, 9], sides: { left: [1, 2, 3, 4, 5, 6, 7, 8, 9], right: [] } },
      "Pasillo B": { suds: Array.from({length: 18}, (_, i) => i + 10), sides: { left: [10, 11, 12, 13, 14, 15, 16, 17, 18], right: [19, 20, 21, 22, 23, 24, 25, 26, 27] } },
      "Pasillo C": { suds: Array.from({length: 18}, (_, i) => i + 28), sides: { left: [28, 29, 30, 31, 32, 33, 34, 35, 36], right: [37, 38, 39, 40, 41, 42, 43, 44, 45] } },
      "Pasillo D": { suds: [46, 47, 48, 49, 50, 51, 52, 53, 54], sides: { left: [], right: [46, 47, 48, 49, 50, 51, 52, 53, 54] } },
      "Pasillo E": { suds: [55, 56, 57, 58, 59, 60, 61, 62, 63], sides: { left: [], right: [55, 56, 57, 58, 59, 60, 61, 62, 63] } },
    };

    const getSudInfo = (sudId) => {
      let aisle = "";
      let side = "left";
      let depth = 1; // 1 near SALIDA (bottom), 9 far back (top)

      for (const [aName, config] of Object.entries(AISLE_CONFIG)) {
        if (config.sides.left.includes(sudId)) {
          aisle = aName;
          side = "left";
          depth = config.sides.left.indexOf(sudId) + 1;
          break;
        } else if (config.sides.right.includes(sudId)) {
          aisle = aName;
          side = "right";
          depth = config.sides.right.indexOf(sudId) + 1;
          break;
        }
      }

      let rotation = "";
      let colorClass = "";
      let bgHex = "";

      if (sudId === 63) {
        rotation = "Libre / Sin Asignar";
        colorClass = "bg-slate-800 text-slate-400 border-slate-700";
        bgHex = "#334155";
      } else if (depth <= 2) {
        rotation = "Alta Rotación (>50 u.)";
        colorClass = "bg-red-600 text-white border-red-500 shadow-sm shadow-red-900/50";
        bgHex = "#dc2626";
      } else if (depth <= 5) {
        rotation = "Media Rotación (15-30 u.)";
        colorClass = "bg-amber-500 text-slate-950 font-semibold border-amber-400";
        bgHex = "#f59e0b";
      } else {
        rotation = "Baja Rotación (<5 u.)";
        colorClass = "bg-emerald-600 text-white border-emerald-500";
        bgHex = "#059669";
      }

      return { sudId, aisle, side, depth, rotation, colorClass, bgHex };
    };

    function App() {
      const [selectedSud, setSelectedSud] = useState(14);
      const [selectedLevel, setSelectedLevel] = useState(2);
      const [mode, setMode] = useState("AUTOMATIC"); // AUTOMATIC or MANUAL
      const [robotState, setRobotState] = useState("IDLE");
      const [isPaused, setIsPaused] = useState(false);
      const [pickingTimer, setPickingTimer] = useState(0);

      // Home / ZONA DE SALIDA Base Coordinate (Unified Single Canvas relative % coords)
      // Home is at bottom-left: x = 11%, y = 90%
      const SALIDA_POS = { x: 11, y: 90 };
      const [robotPos, setRobotPos] = useState(SALIDA_POS);
      const [actuatorLevel, setActuatorLevel] = useState(1.0);

      const [activeJob, setActiveJob] = useState(null);
      const [orderQueue, setOrderQueue] = useState([
        { sud: 14, level: 2 },
        { sud: 32, level: 1 },
        { sud: 50, level: 2 }
      ]);

      const [logs, setLogs] = useState([
        { time: getTimestamp(), sender: "SYSTEM", message: "Warehouse Command Center initialized. Grid matrix 1-63 perfectly aligned." },
        { time: getTimestamp(), sender: "ARDUINO_RX", message: "AMR_AGV_ONLINE | LIDAR_OK | BATTERY_98%" }
      ]);

      const logContainerRef = useRef(null);

      function getTimestamp() {
        const now = new Date();
        return now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      }

      function addLog(sender, message) {
        setLogs(prev => [...prev.slice(-40), { time: getTimestamp(), sender, message }]);
      }

      useEffect(() => {
        if (logContainerRef.current) {
          logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
        }
      }, [logs]);

      // Aisle X center corridor axis coordinates inside single canvas space (%)
      const aisleXCoords = {
        "Pasillo A": 21,
        "Pasillo B": 37,
        "Pasillo C": 53,
        "Pasillo D": 69,
        "Pasillo E": 85
      };

      // Get Sud Y coordinate (%) inside single canvas space (depth 1 bottom y=78%, depth 9 top y=14%)
      const getSudYCoord = (depth) => {
        return 78 - (depth - 1) * 7.6;
      };

      const startPickingOrder = (sud, level) => {
        if (robotState !== "IDLE" && robotState !== "PAUSED") return;

        const targetInfo = getSudInfo(sud);
        setActiveJob({ sud, level, info: targetInfo });
        setIsPaused(false);
        setPickingTimer(0);
        setRobotState("MOVING_X");

        addLog("ARDUINO_TX", `CMD_START_PICK | DEST:SUD_${sud} | AISLE:${targetInfo.aisle.toUpperCase().replace(' ', '_')} | LEVEL:${level}`);
        addLog("ACTUATOR", `TARGET_FORK_ELEVATION_LEVEL_${level}`);
      };

      const handlePauseToggle = () => {
        if (robotState === "IDLE") return;
        if (isPaused) {
          setIsPaused(false);
          addLog("SYSTEM", "RESUMING_AMR_NAVIGATION");
        } else {
          setIsPaused(true);
          addLog("SYSTEM", "AMR_HOLD_BRAKE_ACTIVATED");
        }
      };

      const handleResetToSalida = () => {
        setRobotPos(SALIDA_POS);
        setActuatorLevel(1.0);
        setRobotState("IDLE");
        setIsPaused(false);
        setActiveJob(null);
        setPickingTimer(0);
        addLog("ARDUINO_TX", "EMERGENCY_RESET -> RETURN_TO_HOME_SALIDA");
      };

      const addRandomOrderToQueue = () => {
        const randSud = Math.floor(Math.random() * 63) + 1;
        const randLevel = Math.random() > 0.5 ? 2 : 1;
        setOrderQueue(prev => [...prev, { sud: randSud, level: randLevel }]);
        addLog("SYSTEM", `ORDER_QUEUED: Sud ${randSud} (Nivel ${randLevel})`);
      };

      // Single Canvas Waypoint Movement Engine
      useEffect(() => {
        if (isPaused || robotState === "IDLE" || !activeJob) return;

        const interval = setInterval(() => {
          const targetAisleX = aisleXCoords[activeJob.info.aisle];
          const targetSudY = getSudYCoord(activeJob.info.depth);
          const speed = 1.2;

          setRobotPos(prev => {
            let { x, y } = prev;

            // WAYPOINT 1: Travel horizontally along main transit corridor (y = 90%)
            if (robotState === "MOVING_X") {
              if (Math.abs(x - targetAisleX) <= speed) {
                x = targetAisleX;
                y = SALIDA_POS.y;
                setRobotState("MOVING_Y");
                addLog("ARDUINO_RX", `WAYPOINT_1_REACHED | TURN_INTO_${activeJob.info.aisle.toUpperCase().replace(' ', '_')}`);
              } else {
                x += Math.sign(targetAisleX - x) * speed;
                y = SALIDA_POS.y;
              }
            }
            // WAYPOINT 2: Travel vertically along aisle center lane
            else if (robotState === "MOVING_Y") {
              if (Math.abs(y - targetSudY) <= speed) {
                x = targetAisleX;
                y = targetSudY;
                setRobotState("ELEVATING");
                addLog("ARDUINO_RX", `WAYPOINT_2_REACHED: SUD_${activeJob.sud} (DEPTH ${activeJob.info.depth}) | FORK_ACTUATING`);
              } else {
                x = targetAisleX;
                y += Math.sign(targetSudY - y) * speed;
              }
            }
            // WAYPOINT 4: Return vertically down aisle center lane to main corridor
            else if (robotState === "RETURNING_Y") {
              if (Math.abs(y - SALIDA_POS.y) <= speed) {
                x = targetAisleX;
                y = SALIDA_POS.y;
                setRobotState("RETURNING_X");
                addLog("ARDUINO_RX", `WAYPOINT_4_REACHED | EXIT_AISLE -> MAIN_TRANSIT_LANE`);
              } else {
                x = targetAisleX;
                y += Math.sign(SALIDA_POS.y - y) * speed;
              }
            }
            // WAYPOINT 5: Return horizontally along main transit corridor to ZONA DE SALIDA
            else if (robotState === "RETURNING_X") {
              if (Math.abs(x - SALIDA_POS.x) <= speed) {
                x = SALIDA_POS.x;
                y = SALIDA_POS.y;
                setRobotState("IDLE");
                addLog("ARDUINO_RX", `WAYPOINT_5_REACHED: HOME_SALIDA | JOB_SUD_${activeJob.sud}_SUCCESS`);
                setActiveJob(null);
              } else {
                x += Math.sign(SALIDA_POS.x - x) * speed;
                y = SALIDA_POS.y;
              }
            }

            return { x, y };
          });

          // Fork elevation state machine
          if (robotState === "ELEVATING") {
            const targetLvl = parseFloat(activeJob.level);
            setActuatorLevel(prev => {
              if (Math.abs(prev - targetLvl) <= 0.08) {
                setRobotState("PICKING");
                setPickingTimer(0);
                addLog("ACTUATOR", `ELEVATION_LOCKED_LEVEL_${activeJob.level}`);
                addLog("STATUS", `EXECUTING_ITEM_PICK_RETRIEVAL`);
                return targetLvl;
              }
              return prev + Math.sign(targetLvl - prev) * 0.08;
            });
          } else if (robotState === "PICKING") {
            setPickingTimer(prev => {
              if (prev >= 25) {
                setRobotState("LOWERING");
                addLog("STATUS", `ITEM_PICKED | RETRACTING_FORK_MAST`);
                return 0;
              }
              return prev + 1;
            });
          } else if (robotState === "LOWERING") {
            setActuatorLevel(prev => {
              if (prev <= 1.05) {
                setRobotState("RETURNING_Y");
                addLog("ACTUATOR", `FORK_MAST_RESTING_LEVEL_1 | STARTING_RETURN`);
                return 1.0;
              }
              return prev - 0.08;
            });
          }

        }, 40);

        return () => clearInterval(interval);
      }, [robotState, isPaused, activeJob]);

      useEffect(() => {
        if (mode === "AUTOMATIC" && robotState === "IDLE" && orderQueue.length > 0 && !activeJob) {
          const nextOrder = orderQueue[0];
          setOrderQueue(prev => prev.slice(1));
          setSelectedSud(nextOrder.sud);
          setSelectedLevel(nextOrder.level);
          startPickingOrder(nextOrder.sud, nextOrder.level);
        }
      }, [mode, robotState, orderQueue, activeJob]);

      const currentSudInfo = getSudInfo(selectedSud);

      // Render satellite rack cell with strict grid matrix alignment
      const renderRackCell = (sudId) => {
        if (!sudId) return <div className="w-full h-full opacity-0 pointer-events-none"></div>;
        const info = getSudInfo(sudId);
        const isSelected = selectedSud === sudId;
        const isActiveTarget = activeJob?.sud === sudId;

        return (
          <button
            key={sudId}
            onClick={() => setSelectedSud(sudId)}
            title={`Sud ${sudId} | ${info.aisle} | ${info.rotation}`}
            className={`w-full h-full rounded border text-[9px] font-mono font-bold flex items-center justify-center transition-all ${info.colorClass} ${
              isActiveTarget ? "ring-2 ring-cyan-300 ring-offset-1 ring-offset-slate-950 animate-bounce z-20" :
              isSelected ? "ring-2 ring-white scale-105 z-10" : "hover:opacity-90 hover:scale-105"
            }`}
          >
            S{sudId}
          </button>
        );
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100 p-4 gap-4">

          {/* Industrial Command Center Header */}
          <header className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-2xl relative overflow-hidden">
            <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-500 via-cyan-500 to-emerald-500"></div>

            <div className="flex items-center gap-3">
              <div className="p-2.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-xl shadow-inner">
                <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-extrabold tracking-tight text-white font-mono">WAREHOUSE COMMAND CENTER</h1>
                  <span className="text-[10px] bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 px-2 py-0.5 rounded font-mono font-bold">2D AMR SIMULATOR</span>
                </div>
                <p className="text-xs text-slate-400">Matriz de Nave Industrial Unificada (Sud 1 - 63) • Alineación de Celdas Perfeccionada</p>
              </div>
            </div>

            {/* Industrial Telemetry Indicators */}
            <div className="flex items-center gap-6 bg-slate-950/90 px-4 py-2 rounded-xl border border-slate-800 shadow-inner">
              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-400 font-mono">BATERÍA:</span>
                <span className="text-sm font-bold text-emerald-400 font-mono flex items-center gap-1">
                  ⚡ 98%
                </span>
              </div>
              <div className="h-4 w-px bg-slate-800"></div>
              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-400 font-mono">SENSORES:</span>
                <span className="text-sm font-bold text-cyan-400 font-mono">OK (LiDAR 360°)</span>
              </div>
              <div className="h-4 w-px bg-slate-800"></div>
              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-400 font-mono">ESTADO:</span>
                <span className={`text-xs px-2.5 py-1 rounded font-mono font-bold uppercase tracking-wider ${
                  robotState === "IDLE" ? "bg-slate-800 text-slate-300 border border-slate-700" :
                  robotState === "PICKING" ? "bg-amber-500/20 text-amber-400 border border-amber-500/40 animate-pulse" :
                  "bg-cyan-500/20 text-cyan-300 border border-cyan-500/40"
                }`}>
                  {robotState}
                </span>
              </div>
            </div>
          </header>

          {/* Main Layout Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1">

            {/* UNIFIED SINGLE-CANVAS WAREHOUSE FLOORPLAN CONTAINER (Left 7 Cols) */}
            <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between shadow-2xl relative min-h-[680px]">

              <div className="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                  <span className="text-xs font-bold text-slate-200 font-mono uppercase tracking-wider">
                    PLANO UNIFICADO Y MATRIZ MATRICIAL DE SATÉLITES (SUD 1 - SUD 63)
                  </span>
                </div>

                {/* Popularity Heatmap Legend */}
                <div className="flex items-center gap-3 text-[11px] font-mono">
                  <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-red-600"></span> Alta (&gt;50u)</span>
                  <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-amber-500"></span> Media (15-30u)</span>
                  <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-emerald-600"></span> Baja (&lt;5u)</span>
                  <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-slate-800"></span> Libre</span>
                </div>
              </div>

              {/* SINGLE BOUNDING BOX CANVAS CONTAINER */}
              <div className="relative flex-1 bg-slate-950 border-2 border-slate-700/80 rounded-xl p-3 overflow-hidden select-none shadow-inner min-h-[580px] flex flex-col justify-between">

                {/* Technical Grid Guidance Background (CAD Style) */}
                <svg className="absolute inset-0 w-full h-full opacity-15 pointer-events-none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" strokeWidth="0.5" />
                    </pattern>
                  </defs>
                  <rect width="100%" height="100%" fill="url(#grid)" />
                </svg>

                {/* AISLES HEADER BAND (Pasillos A - E Labels) */}
                <div className="relative z-10 grid grid-cols-5 gap-2 text-center pt-1 pb-2 font-mono text-[11px] font-bold">
                  {Object.keys(AISLE_CONFIG).map((aisle) => (
                    <div key={aisle} className="bg-slate-900 border border-cyan-800/80 text-cyan-400 py-1 rounded shadow-sm">
                      {aisle}
                    </div>
                  ))}
                </div>

                {/* RACK GRID MATRIX (Depths 9 down to 1 - Perfect horizontal & vertical alignment) */}
                <div className="relative z-10 flex-1 grid grid-rows-9 gap-1.5 my-2">
                  {[9, 8, 7, 6, 5, 4, 3, 2, 1].map((depthRow) => (
                    <div key={depthRow} className="grid grid-cols-5 gap-2 items-center">

                      {/* Pasillo A (Left Rack: Sud depthRow, Right: Empty) */}
                      <div className="grid grid-cols-2 gap-1 h-full">
                        {renderRackCell(AISLE_CONFIG["Pasillo A"].sides.left[depthRow - 1])}
                        {renderRackCell(null)}
                      </div>

                      {/* Pasillo B (Left Rack: Sud 10-18, Right Rack: Sud 19-27) */}
                      <div className="grid grid-cols-2 gap-1 h-full">
                        {renderRackCell(AISLE_CONFIG["Pasillo B"].sides.left[depthRow - 1])}
                        {renderRackCell(AISLE_CONFIG["Pasillo B"].sides.right[depthRow - 1])}
                      </div>

                      {/* Pasillo C (Left Rack: Sud 28-36, Right Rack: Sud 37-45) */}
                      <div className="grid grid-cols-2 gap-1 h-full">
                        {renderRackCell(AISLE_CONFIG["Pasillo C"].sides.left[depthRow - 1])}
                        {renderRackCell(AISLE_CONFIG["Pasillo C"].sides.right[depthRow - 1])}
                      </div>

                      {/* Pasillo D (Left: Empty, Right Rack: Sud 46-54) */}
                      <div className="grid grid-cols-2 gap-1 h-full">
                        {renderRackCell(null)}
                        {renderRackCell(AISLE_CONFIG["Pasillo D"].sides.right[depthRow - 1])}
                      </div>

                      {/* Pasillo E (Left: Empty, Right Rack: Sud 55-63) */}
                      <div className="grid grid-cols-2 gap-1 h-full">
                        {renderRackCell(null)}
                        {renderRackCell(AISLE_CONFIG["Pasillo E"].sides.right[depthRow - 1])}
                      </div>

                    </div>
                  ))}
                </div>

                {/* Main Horizontal Corridor Transit Lane (Bottom Floor Marking) */}
                <div className="relative z-0 h-[10%] bg-slate-900/90 rounded-lg border-2 border-dashed border-slate-700 flex items-center justify-around text-[10px] text-slate-500 font-mono tracking-widest mt-1">
                  <span>◄◄ CARRIL PRINCIPAL DE TRÁNSITO HORIZONTAL DEL ROBOT AMR ►►</span>
                </div>

                {/* ZONA DE SALIDA (Home Charging Station with Industrial Safety Stripes) */}
                <div className="absolute bottom-[2%] left-[2%] w-[14%] h-[12%] bg-safety-stripes border-2 border-emerald-500 rounded-xl flex flex-col items-center justify-center text-center p-1 shadow-lg shadow-emerald-950/60 z-20">
                  <span className="text-[10px] font-black text-emerald-400 uppercase tracking-tighter">ZONA DE</span>
                  <span className="text-xs font-black text-emerald-300 uppercase tracking-tight">SALIDA</span>
                  <span className="text-[8px] text-emerald-400 font-mono font-bold">(HOME / CHARGE)</span>
                </div>

                {/* Stylized AMR Robot Vehicle Icon */}
                <div
                  className="absolute w-9 h-9 -ml-4 -mt-4 transition-all duration-75 z-30 flex items-center justify-center"
                  style={{ left: `${robotPos.x}%`, top: `${robotPos.y}%` }}
                >
                  <div className={`relative w-full h-full rounded-xl border-2 flex flex-col items-center justify-center shadow-2xl transition-transform ${
                    robotState === "PICKING" ? "bg-amber-500 border-amber-300 text-slate-950 animate-pulse scale-125 shadow-amber-500/50" : "bg-cyan-600 border-cyan-300 text-white shadow-cyan-500/50"
                  }`}>
                    {/* Status Beacon LED */}
                    <div className="absolute -top-1 right-0 w-2 h-2 rounded-full bg-emerald-400 animate-ping"></div>

                    <span className="text-xs leading-none">🤖</span>
                    <span className="text-[8px] font-mono font-black leading-none mt-0.5">L{Math.round(actuatorLevel)}</span>

                    {/* Actuator Vertical Fork Mast */}
                    <div
                      className="absolute -top-3.5 w-2 bg-amber-400 rounded-t transition-all duration-100 border border-amber-200 shadow-sm"
                      style={{ height: `${actuatorLevel * 9}px` }}
                    ></div>
                  </div>
                </div>

              </div>
            </div>

            {/* Industrial Control & Virtual Terminal Panel (Right 5 Cols) */}
            <div className="lg:col-span-5 flex flex-col gap-4">

              {/* Order Command Panel */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl flex flex-col gap-3">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <h2 className="text-xs font-bold text-slate-200 font-mono uppercase tracking-wider flex items-center gap-2">
                    🎛️ PANEL DE CONTROL DE PEDIDOS
                  </h2>
                  <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-mono">
                    <button
                      onClick={() => setMode("AUTOMATIC")}
                      className={`px-2.5 py-1 rounded transition font-bold ${mode === "AUTOMATIC" ? "bg-cyan-600 text-white" : "text-slate-400"}`}
                    >
                      AUTO
                    </button>
                    <button
                      onClick={() => setMode("MANUAL")}
                      className={`px-2.5 py-1 rounded transition font-bold ${mode === "MANUAL" ? "bg-cyan-600 text-white" : "text-slate-400"}`}
                    >
                      MANUAL
                    </button>
                  </div>
                </div>

                {/* Target Sud Dropdown & Level Selection */}
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs text-slate-400 mb-1 block font-mono">Ubicación Destino:</label>
                    <select
                      value={selectedSud}
                      onChange={(e) => setSelectedSud(Number(e.target.value))}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 font-mono"
                    >
                      {Array.from({length: 63}, (_, i) => i + 1).map(id => {
                        const info = getSudInfo(id);
                        return (
                          <option key={id} value={id}>
                            Sud {id} ({info.aisle})
                          </option>
                        );
                      })}
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 mb-1 block font-mono">Nivel de Horquilla:</label>
                    <div className="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-lg border border-slate-700 font-mono">
                      <button
                        onClick={() => setSelectedLevel(1)}
                        className={`py-1.5 text-xs rounded font-bold transition ${selectedLevel === 1 ? "bg-emerald-600 text-white" : "text-slate-400"}`}
                      >
                        Nivel 01
                      </button>
                      <button
                        onClick={() => setSelectedLevel(2)}
                        className={`py-1.5 text-xs rounded font-bold transition ${selectedLevel === 2 ? "bg-emerald-600 text-white" : "text-slate-400"}`}
                      >
                        Nivel 02
                      </button>
                    </div>
                  </div>
                </div>

                {/* Selected Location Card */}
                <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 flex items-center justify-between text-xs font-mono">
                  <div>
                    <span className="text-slate-400 block text-[10px]">Detalles de la Posición:</span>
                    <span className="font-bold text-cyan-400">Sud {selectedSud} • {currentSudInfo.aisle} • Lado {currentSudInfo.side}</span>
                  </div>
                  <div className="text-right">
                    <span className="text-slate-400 block text-[10px]">Rotación:</span>
                    <span className={`px-2 py-0.5 rounded font-bold inline-block text-[10px] ${currentSudInfo.colorClass}`}>
                      {currentSudInfo.rotation}
                    </span>
                  </div>
                </div>

                {/* Action Buttons */}
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => startPickingOrder(selectedSud, selectedLevel)}
                    disabled={robotState !== "IDLE" && robotState !== "PAUSED"}
                    className="col-span-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold font-mono py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition shadow-lg shadow-emerald-950/50"
                  >
                    ► INICIAR PICKING AUTOMÁTICO
                  </button>
                  <button
                    onClick={handlePauseToggle}
                    className="bg-amber-600 hover:bg-amber-500 text-white font-semibold font-mono py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1 transition"
                  >
                    {isPaused ? "▶ Reanudar" : "⏸ Pausa / Hold"}
                  </button>
                  <button
                    onClick={handleResetToSalida}
                    className="bg-red-600 hover:bg-red-500 text-white font-semibold font-mono py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1 transition"
                  >
                    ↺ Reset a Home
                  </button>
                </div>

                {/* Automatic Order Queue */}
                <div className="border-t border-slate-800 pt-2 font-mono">
                  <div className="flex items-center justify-between mb-1.5">
                    <span className="text-xs font-semibold text-slate-300">Cola de Pedidos Pendientes:</span>
                    <button onClick={addRandomOrderToQueue} className="text-[10px] text-cyan-400 hover:underline">
                      + Agregar Random
                    </button>
                  </div>
                  <div className="flex gap-1.5 overflow-x-auto pb-1">
                    {orderQueue.length === 0 ? (
                      <span className="text-xs text-slate-500 italic">Sin pedidos en cola.</span>
                    ) : (
                      orderQueue.map((item, idx) => (
                        <span key={idx} className="bg-slate-950 border border-slate-800 text-slate-300 px-2 py-1 rounded text-[10px] font-mono whitespace-nowrap">
                          Sud {item.sud} (L{item.level})
                        </span>
                      ))
                    )}
                  </div>
                </div>

              </div>

              {/* Virtual Serial Terminal (Arduino Log Monitor) */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl flex-1 flex flex-col min-h-[240px]">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2 mb-2">
                  <div className="flex items-center gap-2">
                    <div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <h3 className="text-xs font-bold text-slate-300 font-mono">MONITOR SERIAL VIRTUAL (ARDUINO UART)</h3>
                  </div>
                  <button
                    onClick={() => setLogs([])}
                    className="text-[10px] text-slate-500 hover:text-slate-300 font-mono"
                  >
                    [LIMPIAR LOGS]
                  </button>
                </div>

                {/* Terminal Log Console */}
                <div
                  ref={logContainerRef}
                  className="flex-1 bg-slate-950 border border-slate-800/80 rounded-lg p-3 font-mono text-[11px] leading-relaxed overflow-y-auto flex flex-col gap-1 text-slate-300 select-text shadow-inner"
                >
                  {logs.map((log, index) => (
                    <div key={index} className="flex gap-2">
                      <span className="text-slate-500">[{log.time}]</span>
                      <span className={`font-bold ${
                        log.sender === "ARDUINO_TX" ? "text-cyan-400" :
                        log.sender === "ARDUINO_RX" ? "text-emerald-400" :
                        log.sender === "ACTUATOR" ? "text-amber-400" : "text-purple-400"
                      }`}>
                        [{log.sender}]
                      </span>
                      <span className="text-slate-200">{log.message}</span>
                    </div>
                  ))}
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
